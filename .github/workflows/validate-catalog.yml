name: Validate music catalog
on:
  push:
    branches: [main]
    paths: ['catalog.json', 'tracks/**', 'Scripts/music_catalog.py', '.github/workflows/validate-catalog.yml']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 Scripts/music_catalog.py validate
